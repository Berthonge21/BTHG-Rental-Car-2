name: Publish SDK to GitHub Packages

# NOTE: apps/web now consumes packages/sdk directly via the Yarn workspace
# link (package name "@bthgrentalcar/sdk", no registry involved) rather than
# this published artifact, so this workflow is currently dormant — it only
# runs on an "sdk/v*" tag push or a manual dispatch, neither of which happens
# in normal development. If external publishing is revived later (e.g. for a
# mobile app outside this monorepo), update the scope below to match wherever
# the package is actually published — "@berthonge21" ties it to a personal
# GitHub account, which is deliberately avoided for the workspace-linked path.

on:
  push:
    tags:
      - 'sdk/v*' # Trigger on tags like sdk/v1.0.0, sdk/v1.2.3
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (build only, do not publish)'
        type: boolean
        default: false

jobs:
  publish:
    name: Build & Publish @berthonge21/sdk
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@berthonge21'

      - name: Install SDK dependencies
        working-directory: packages/sdk
        run: npm install

      - name: Build SDK
        working-directory: packages/sdk
        run: npm run build

      - name: Verify dist output
        working-directory: packages/sdk
        run: ls -la dist/

      - name: Publish to GitHub Packages
        if: ${{ !inputs.dry_run }}
        working-directory: packages/sdk
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
